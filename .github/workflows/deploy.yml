name: Deploy Carawin Tech Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: carawin-production
  cancel-in-progress: true

jobs:

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/carawin-technologies/carawin-tech-site:latest \
            -t ghcr.io/carawin-technologies/carawin-tech-site:${{ github.sha }} \
            .

      - name: Push latest image
        run: |
          docker push ghcr.io/carawin-technologies/carawin-tech-site:latest

      - name: Push commit image
        run: |
          docker push ghcr.io/carawin-technologies/carawin-tech-site:${{ github.sha }}


  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            cd /root/carawin-tech-site

            docker compose pull

            docker compose up -d

            docker image prune -f

            docker ps --filter "name=carawin-tech-site"
